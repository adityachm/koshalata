<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Koshalata Admin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Montserrat:wght@400;500;600&display=swap" rel="stylesheet"/>
  
  <link rel="icon" type="image/png" href="logo.png"/>
  <link rel="stylesheet" href="admin.css"/>
</head>
<body>

<!-- LOGIN SCREEN -->
<div id="login-screen">
  <div class="login-box">
    <div class="login-logo">Koshalata</div>
    <p class="login-sub">Admin Panel</p>
    <form id="login-form">
      <label>Password</label>
      <input type="password" id="login-pw" placeholder="Enter admin password" required autocomplete="current-password"/>
      <div id="login-err" class="err-msg" hidden>Incorrect password.</div>
      <button type="submit" class="btn-primary">Sign In</button>
    </form>
  </div>
</div>

<!-- DASHBOARD -->
<div id="dashboard" hidden>
  <header class="adm-header">
    <div class="adm-brand">Koshalata <span>Admin</span></div>
    <div class="adm-header-right">
      <a href="/" target="_blank" class="btn-outline">View Site</a>
      <button class="btn-ghost" id="logout-btn">Sign Out</button>
    </div>
  </header>

  <main class="adm-main">

    <!-- Cover Photo -->
    <div class="settings-card">
      <div class="settings-card-hd">
        <div>
          <h2 class="settings-title">Cover Photo</h2>
          <p class="settings-sub">The full-screen background on the homepage hero</p>
        </div>
        <button class="btn-outline" id="cover-upload-btn">Upload New Photo</button>
        <input type="file" id="cover-input" accept="image/jpeg,image/png,image/webp" hidden/>
      </div>
      <div id="cover-preview-wrap" class="cover-preview-wrap">
        <div class="cover-preview-empty" id="cover-preview-empty">No custom cover — showing default hero image</div>
        <img id="cover-preview-img" hidden/>
      </div>
      <div id="cover-status-bar" class="upload-status-bar" hidden>
        <div class="upload-bar"><div class="upload-fill" id="cover-fill"></div></div>
        <span id="cover-status">Uploading…</span>
      </div>
      <div id="cover-err" class="err-msg" hidden></div>
    </div>

    <div class="adm-top">
      <h1>Saree Listings</h1>
      <button class="btn-primary" id="add-btn">+ Add Saree</button>
    </div>

    <div id="saree-list" class="saree-table-wrap">
      <p class="loading-msg">Loading…</p>
    </div>
  </main>
</div>

<!-- ADD / EDIT MODAL -->
<div id="modal-overlay" class="modal-overlay" hidden>
  <div class="modal">
    <div class="modal-header">
      <h2 id="modal-title">Add Saree</h2>
      <button class="modal-close" id="modal-close-btn">&times;</button>
    </div>

    <form id="saree-form" class="saree-form">
      <input type="hidden" id="edit-id"/>

      <!-- Multi-image upload -->
      <div class="form-group">
        <label>Saree Images <span class="req">*</span> <span class="opt">first image shown as main · add up to 6</span></label>
        <div class="multi-img-list" id="multi-img-list"></div>
        <button type="button" class="btn-add-img" id="add-img-btn">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
          Add Image
        </button>
        <input type="file" id="img-input" accept="image/jpeg,image/png,image/webp" hidden/>
        <div id="upload-status-bar" class="upload-status-bar" hidden>
          <div class="upload-bar"><div class="upload-fill" id="upload-fill"></div></div>
          <span id="upload-status">Uploading…</span>
        </div>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label>Saree Name <span class="req">*</span></label>
          <input type="text" id="name" placeholder="e.g. Crimson Brocade" required/>
        </div>
        <div class="form-group">
          <label>Collection <span class="req">*</span></label>
          <select id="collection" required>
            <option value="">Select collection</option>
            <option>New Arrivals</option>
            <option>Heritage Silks</option>
            <option>Bridal Couture</option>
            <option>Signature Drapes</option>
            <option>Festive Edit</option>
            <option>Other</option>
          </select>
        </div>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label>Type / Fabric <span class="req">*</span></label>
          <select id="type" required>
            <option value="">Select type</option>
            <option>Banarasi Silk</option>
            <option>Kanjivaram Silk</option>
            <option>Chanderi Silk</option>
            <option>Tussar Silk</option>
            <option>Organza</option>
            <option>Chiffon</option>
            <option>Cotton</option>
            <option>Other</option>
          </select>
        </div>
        <div class="form-group">
          <label>Badge</label>
          <select id="badge">
            <option value="">None</option>
            <option>New</option>
            <option>Bridal Pick</option>
            <option>Limited</option>
            <option>Bestseller</option>
          </select>
        </div>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label>Price (₹) <span class="req">*</span></label>
          <input type="number" id="price" placeholder="e.g. 14999" min="1" required/>
        </div>
        <div class="form-group">
          <label>Original Price (₹) <span class="opt">optional — shows strikethrough</span></label>
          <input type="number" id="original_price" placeholder="e.g. 18999" min="1"/>
        </div>
      </div>

      <div class="form-group">
        <label>Description <span class="opt">optional — shown on the card</span></label>
        <textarea id="description" rows="3" placeholder="e.g. Hand-woven in Varanasi with pure Banarasi silk and gold zari…"></textarea>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label>Sort Order <span class="opt">lower = appears first</span></label>
          <input type="number" id="sort_order" placeholder="0" min="0"/>
        </div>
        <div class="form-group">
          <label>WhatsApp Message <span class="opt">auto-generated if blank</span></label>
          <input type="text" id="wa_message" placeholder="Hello Koshalata, I'm interested in…"/>
        </div>
      </div>

      <div id="form-err" class="err-msg" hidden></div>

      <div class="modal-actions">
        <button type="button" class="btn-ghost" id="form-cancel-btn">Cancel</button>
        <button type="submit" class="btn-primary" id="form-submit-btn">Save Saree</button>
      </div>
    </form>
  </div>
</div>

<script src="admin.js"></script>
</body>
</html>
